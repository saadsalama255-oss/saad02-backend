// ---- settings
const LB={reasons:'أسباب المرتجعات',branches:'الفروع',ncrTypes:'أنواع عدم المطابقة',actions:'الإجراءات المتخذة للمرتجعات',wh:'المخازن',suppliers:'جهات التوريد',defects:'أنواع عيوب الكراتين',dwh:'مخازن الصرف'};
function set(){const s=db.set;$('#mn').innerHTML=`<h2>⚙️ الإدارة</h2>${ADM()}<div class="card"><b>حدود درجات الحرارة</b>${s.units.map((u,i)=>`<div class="row"><input value="${esc(u.n)}" onchange="s_(${i},'n',this.value)"><select onchange="s_(${i},'t',this.value)"><option ${u.t=='ثلاجة'?'selected':''}>ثلاجة</option><option ${u.t=='سيارة'?'selected':''}>سيارة</option></select><input type="number" value="${u.min}" onchange="s_(${i},'min',this.value)"><input type="number" value="${u.max}" onchange="s_(${i},'max',this.value)"><button class="lk bad" onclick="db.set.units.splice(${i},1);save();set()">✕</button></div>`).join('')}<small>الاسم • النوع • الأدنى • الأقصى</small><button class="b" style="width:100%" onclick="db.set.units.push({n:'وحدة جديدة',t:'ثلاجة',min:-25,max:-18});save();set()">+ وحدة</button></div>
${Object.keys(LB).map(k=>`<div class="card"><b>${LB[k]}</b>${s[k].map((x,i)=>`<div class="row"><input value="${esc(x)}" onchange="db.set.${k}[${i}]=this.value.trim();save()"><button class="lk bad" onclick="db.set.${k}.splice(${i},1);save();set()">✕</button></div>`).join('')}<button class="b" style="width:100%" onclick="db.set.${k}.push('جديد');save();set()">+ إضافة</button></div>`).join('')}
<div class="card"><b>عنوان المزامنة (Cloud Backend URL)</b><input value="${esc(s.syncUrl)}" onchange="db.set.syncUrl=this.value.trim();save()" placeholder="https://..."><button class="b" onclick="sync()">مزامنة الآن</button></div>
<div class="card"><b>إدارة البيانات والنسخ الاحتياطي</b><button class="b" onclick="exp('FrozenGuard-Backup-${td()}.json','application/json',JSON.stringify(db))">تصدير كامل قاعدة البيانات (JSON)</button><label class="b g" style="text-align:center;cursor:pointer">استيراد نسخة احتياطية<input type="file" id="bkf" style="display:none" onchange="bkFile(this)"></label><div id="bkr"></div><textarea id="bk" style="display:none"></textarea></div>`}
function s_(i,k,v){db.set.units[i][k]=k=='min'||k=='max'?+v:v;save()}
function ADM(){return me.r==='Admin'?`<div class="card"><b>المستخدمون والصلاحيات</b>${db.users.map((u,i)=>`<div class="row"><span><b>${esc(u.n)}</b> (${esc(u.u)})</span><span class="pill">${RL[u.r]||u.r}</span>${u.u!=='admin'?`<button class="lk bad" onclick="db.users.splice(${i},1);save();set()">حذف</button>`:''}</div>`).join('')}<button class="b" onclick="newUsr()">+ مستخدم جديد</button></div>`:''}
function newUsr(){const u=prompt('اسم المستخدم (ID):'),n=prompt('الاسم الكامل:'),r=prompt('الصلاحية: Admin / Quality / QMgr / Driver / User1','Quality'),p=prompt('كلمة المرور:','1234');if(!u||!n||!r||!p)return;if(db.users.some(x=>x.u===u))return toast('المستخدم موجود مسبقاً',1);db.users.push({u:u.trim(),n:n.trim(),r:r.trim(),p:H(p)});save();set();toast('تمت الإضافة')}
// ---- extra modules
function more(){$('#mn').innerHTML=`<h2>⋯ المزيد</h2><div class="card mi" onclick="pg='rep';R()"><div class="ic">📊</div><div><b>التقارير المتقدمة</b><div class="s">عرض وتصدير وتقسيم السجلات</div></div></div><div class="card mi" onclick="pg='set';R()"><div class="ic">⚙️</div><div><b>الإعدادات والإدارة</b><div class="s">الوحدات، الفروع، والمستخدمين</div></div></div><div class="card mi" onclick="pg='audit';R()"><div class="ic">📜</div><div><b>سجل النشاطات (Audit Trail)</b><div class="s">متابعة العمليات والتعديلات</div></div></div>`}
function audit(){$('#mn').innerHTML=`<h2>📜 سجل النشاطات</h2><div class="card">${(db.audit||[]).slice(-50).reverse().map(a=>`<div><b>${esc(a.u)}</b> — ${esc(a.act)} (${esc(a.mod)}) <small>${fmt(a.cr)}</small>${a.dat?'<div class="s">'+esc(JSON.stringify(a.dat))+'</div>':''}</div><hr style="border:0;border-top:1px solid var(--b);margin:6px 0">`).join('')}</div>`}
function aud(act,mod,dat){db.audit=db.audit||[];db.audit.push({cr:new Date().toISOString(),u:me.u,act,mod,dat});save()}
function autoNcr(r,desc){db.ncr.push({id:Date.now().toString(36),cr:new Date().toISOString(),by:me.n,s:0,no:'NC-'+Math.floor(1e5+Math.random()*9e5),date:td(),type:'انحراف حرارة',sev:'جسيمة',product:r.prod||r.unit||'—',batch:r.batch||'—',desc,action:'قيد المتابعة والفحص',status:'مفتوحة'})}
function det(id){const b=db.batches.find(x=>x.id===id);if(!b)return;$('#md').innerHTML=`<div class="sh" style="text-align:center"><h3>تتبع الدفعة: ${esc(b.no)}</h3><div class="qr" id="qrc"></div><p>المنتج: ${esc(b.prod)} • الكمية: ${b.qty}</p><button class="b" onclick="cl()">إغلاق</button></div>`;$('#md').className='on';try{const q=qrcode(0,'M');q.addData(b.no+'|'+b.prod+'|'+b.qty);q.make();$('#qrc').innerHTML=q.createSvgTag()}catch(e){}}
function ltg(r){const b=db.batches.find(x=>x.no===(r.batch||r.no));return{qty:b?b.qty:0,kg:b?b.kg:0,refs:b?b.no:'—'}}
const ltm=r=>{if(!r.t1||!r.t2)return'—';const [h1,m1]=r.t1.split(':').map(Number),[h2,m2]=r.t2.split(':').map(Number);return Math.max(0,(h2*60+m2)-(h1*60+m1))}
const ltr=r=>{const d=+ltm(r),k=+ltg(r).kg;return d>0&&k>0?(k/(d/60)).toFixed(2):'0'}
function kit(r){return db.batches.filter(b=>b.rid===r.id||b.mid===r.id)}
const mcn=r=>db.mvs.find(x=>x.id===r.mid)?.no||''
const bal=b=>{const al=db.ops.filter(o=>o.batch===b.no);return(+b.qty||0)+al.reduce((a,o)=>a+(o.type==='صرف'?-+o.qty:o.type==='مرتجع'||o.type==='تسوية'?+o.qty:0),0)}
function chk(k,o,id){if(k==='batches'){if(!id&&db.batches.some(b=>b.no===o.no))return'رقم الدفعة موجود مسبقاً';if(o.pd&&o.ex&&o.pd>o.ex)return'تاريخ الإنتاج لا يمكن أن يكون بعد تاريخ الصلاحية'}if(k==='ops'){const b=db.batches.find(x=>x.no===o.batch);if(!b)return'الدفعة غير موجودة';if(o.type==='صرف'&&bal(b)<+o.qty)return'الكمية المطلوبة أكبر من الرصيد الحالي للدفعة ('+bal(b)+')'}return null}
function clo(k,id){const r=db[k].find(x=>x.id===id);if(!r)return;const ac=prompt('أدخل الإجراء التصحيحي للإغلاق:','تم المعالجة بنجاح');if(!ac)return;r.status='مغلقة';r.action=ac;r.s=0;aud('إغلاق عدم مطابقة','ncr',r);save();R();sync()}
function P(){return{dash,bat:()=>mod('batches'),opr:()=>mod('ops'),tmp:()=>mod('temps'),lt:()=>mod('lt'),qual:()=>mod('ncr'),more,audit,set,rep}}
R();
</script></body></html>
